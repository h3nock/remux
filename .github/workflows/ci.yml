name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Nightly runs only the UI tests.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nightly runs get their own group so they and pushes to main don't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-schedule' || '' }}
  cancel-in-progress: true

env:
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  changes:
    name: Changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            printf 'app=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          app_changed=false
          while IFS= read -r path; do
            case "${path}" in
              remux-site/*|docs/*|README.md|LICENSE)
                ;;
              *)
                app_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          printf 'app=%s\n' "${app_changed}" >> "${GITHUB_OUTPUT}"

  site:
    name: Site
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          node --check remux-site/script.js

          while IFS= read -r asset; do
            test -f "remux-site/${asset}" || {
              printf 'Missing site asset: %s\n' "${asset}" >&2
              exit 1
            }
          done < <(rg -o 'assets/[^"?]+' remux-site/index.html | sort -u)

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "${XCODE_DEVELOPER_DIR}"
          sudo xcode-select --switch "${XCODE_DEVELOPER_DIR}"
          xcodebuild -version

      - name: Test authorized-key installer
        shell: bash
        run: scripts/test_install_authorized_key.sh

      - name: Create simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and .platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          test -n "${runtime_id}"
          udid="$(xcrun simctl create "Remux CI ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17e "${runtime_id}")"
          printf 'udid=%s\n' "${udid}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${udid}"

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        shell: bash
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/xcodegen.zip"
          curl --fail --location --silent --show-error --output "${zip_path}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          actual_sha256="$(shasum -a 256 "${zip_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${XCODEGEN_SHA256}" ]]; then
            printf 'Checksum mismatch for XcodeGen %s.\n  expected: %s\n  actual:   %s\n' \
              "${XCODEGEN_VERSION}" "${XCODEGEN_SHA256}" "${actual_sha256}" >&2
            exit 1
          fi

          ditto -x -k "${zip_path}" "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version

      - name: Fetch GhosttyKit
        shell: bash
        run: scripts/fetch_ghosttykit.sh

      - name: Verify GhosttyKit
        env:
          CONFIGURATION: Release
          GHOSTTYKIT_XCFRAMEWORK: ${{ github.workspace }}/../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        shell: bash
        run: scripts/verify_ghosttykit_release_mode.sh

      - name: Verify generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Remux.xcodeproj

      - name: Build UI tests
        shell: bash
        run: xcodebuild build-for-testing -project Remux.xcodeproj -scheme RemuxUIOnly -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

      - name: Wait for simulator
        shell: bash
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/RemuxUnitTests.xcresult"
          xcodebuild test -project Remux.xcodeproj -scheme Remux -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -only-testing:RemuxTests -resultBundlePath "${RUNNER_TEMP}/RemuxUnitTests.xcresult"

      - name: Delete simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        run: xcrun simctl delete "${{ steps.simulator.outputs.udid }}"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: remux-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    # Tracks the simulated UI tests on main without gating anything: this job
    # is not a required check and never runs on pull requests.
    name: UI tests
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 50
    env:
      # Pinned so the tests stay on iOS 26 when the runner image adds newer runtimes.
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "${XCODE_DEVELOPER_DIR}"
          sudo xcode-select --switch "${XCODE_DEVELOPER_DIR}"
          xcodebuild -version

      - name: Create simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun simctl list runtimes --json | jq -e --arg id "${IOS_SIMULATOR_RUNTIME}" '.runtimes[] | select(.identifier == $id and .isAvailable == true)' > /dev/null; then
            printf 'Simulator runtime %s is not available on this runner. Installed iOS runtimes:\n' "${IOS_SIMULATOR_RUNTIME}" >&2
            xcrun simctl list runtimes iOS >&2
            exit 1
          fi
          udid="$(xcrun simctl create "Remux CI ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17e "${IOS_SIMULATOR_RUNTIME}")"
          printf 'udid=%s\n' "${udid}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${udid}"

      - name: Fetch GhosttyKit
        shell: bash
        run: scripts/fetch_ghosttykit.sh

      - name: Build UI tests
        shell: bash
        run: xcodebuild build-for-testing -project Remux.xcodeproj -scheme RemuxUIOnly -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"

      - name: Wait for simulator
        shell: bash
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Run UI tests
        shell: bash
        run: |
          set -euo pipefail
          # Live UI tests need a real SSH server and run only through
          # scripts/remux_live_ui_test_with_cleanup.sh.
          skip_live=()
          while IFS= read -r test_name; do
            skip_live+=("-skip-testing:RemuxUITests/RemuxAppUITests/${test_name}")
          done < <(grep -oE 'func (testLive[A-Za-z0-9]*|testCaptureDesignReviewScreens)\(' RemuxAppUITests/RemuxAppUITests.swift | sed -E 's/^func ([A-Za-z0-9]+)\($/\1/')
          rm -rf "${RUNNER_TEMP}/RemuxUITests.xcresult"
          xcodebuild test-without-building -project Remux.xcodeproj -scheme RemuxUIOnly -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -collect-test-diagnostics never -resultBundlePath "${RUNNER_TEMP}/RemuxUITests.xcresult" "${skip_live[@]}"

      - name: Delete simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        run: xcrun simctl delete "${{ steps.simulator.outputs.udid }}"

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: remux-ui-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
