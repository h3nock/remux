name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. Every other run keeps
# to itself, so a later merge can't cancel the check of an earlier one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ghosttykit: ${{ steps.filter.outputs.ghosttykit }}

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PULL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A push is judged by what it added to the branch. A manual run, or a
          # push whose earlier commit isn't in the history, checks everything.
          range=""
          case "${EVENT_NAME}" in
            pull_request)
              range="${PULL_BASE_SHA}...${PULL_HEAD_SHA}"
              ;;
            push)
              if git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2> /dev/null; then
                range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              fi
              ;;
          esac

          # Without rename detection a file moved out of the app still lists its
          # old path. A comparison that fails checks everything too.
          if [[ -z "${range}" ]] || ! paths="$(git diff --name-only --no-renames "${range}")"; then
            printf 'app=true\nghosttykit=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          app_changed=false
          ghosttykit_changed=false
          while IFS= read -r path; do
            case "${path}" in
              "")
                ;;
              remux-site/*|scripts/check_site.sh|docs/*|README.md|LICENSE)
                ;;
              scripts/fetch_ghosttykit.sh|scripts/verify_ghosttykit_release_mode.sh|.github/workflows/ci.yml)
                app_changed=true
                ghosttykit_changed=true
                ;;
              *)
                app_changed=true
                ;;
            esac
          done <<< "${paths}"

          if [[ "${EVENT_NAME}" != "pull_request" && "${app_changed}" == "true" ]]; then
            ghosttykit_changed=true
          fi

          printf 'app=%s\nghosttykit=%s\n' "${app_changed}" "${ghosttykit_changed}" >> "${GITHUB_OUTPUT}"

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Validate static site
        shell: bash
        run: scripts/check_site.sh

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true' && !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Check out Remux
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "${XCODE_DEVELOPER_DIR}"
          sudo xcode-select --switch "${XCODE_DEVELOPER_DIR}"
          xcodebuild -version
          printf 'build=%s\n' "$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "${GITHUB_OUTPUT}"

      - name: Test authorized-key installer
        shell: bash
        run: scripts/test_install_authorized_key.sh

      - name: Test remote program launcher
        shell: bash
        run: scripts/test_remote_program_command.sh

      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        shell: bash
        run: |
          set -euo pipefail
          zip_path="${RUNNER_TEMP}/xcodegen.zip"
          curl --fail --location --silent --show-error --output "${zip_path}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"

          actual_sha256="$(shasum -a 256 "${zip_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${XCODEGEN_SHA256}" ]]; then
            printf 'Checksum mismatch for XcodeGen %s.\n  expected: %s\n  actual:   %s\n' \
              "${XCODEGEN_VERSION}" "${XCODEGEN_SHA256}" "${actual_sha256}" >&2
            exit 1
          fi

          ditto -x -k "${zip_path}" "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/xcodegen/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/xcodegen/bin/xcodegen" --version

      - name: Fetch GhosttyKit
        shell: bash
        run: scripts/fetch_ghosttykit.sh

      - name: Verify GhosttyKit
        shell: bash
        run: scripts/fetch_ghosttykit.sh --verify

      # The pinned checksum fixes the framework's bytes, so its build mode can
      # only change with the pin, the check itself, or this workflow.
      - name: Verify GhosttyKit build mode
        if: needs.changes.outputs.ghosttykit == 'true'
        env:
          CONFIGURATION: Release
          GHOSTTYKIT_XCFRAMEWORK: ${{ github.workspace }}/../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        shell: bash
        run: scripts/verify_ghosttykit_release_mode.sh

      - name: Verify generated Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Remux.xcodeproj

      - name: Restore Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: swift-packages-${{ runner.os }}-${{ hashFiles('Remux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swift-packages-${{ runner.os }}-

      # Pull requests restore the newest cache from main and never save one, so
      # they don't fill the repository's cache space.
      - name: Restore compilation cache
        id: compilation-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.build }}-

      # A new simulator's first boot keeps the runner busy for minutes. Booting
      # it here overlaps that work with the build instead of stalling the short
      # setup steps above.
      - name: Create simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes --json | jq -r '[.runtimes[] | select(.isAvailable == true and .platform == "iOS")] | sort_by(.version | split(".") | map(tonumber)) | last.identifier')"
          test -n "${runtime_id}"
          udid="$(xcrun simctl create "Remux CI ${GITHUB_RUN_ID}" com.apple.CoreSimulator.SimDeviceType.iPhone-17e "${runtime_id}")"
          printf 'udid=%s\n' "${udid}" >> "${GITHUB_OUTPUT}"
          xcrun simctl boot "${udid}"

      # The Remux scheme builds the UI tests for testing too, so this one build
      # compiles everything the job checks. The size limit makes Xcode prune the
      # restored compilation cache, which otherwise grows with every save. Xcode
      # starts a new cache generation once the current one passes half the
      # limit, so half of it holds a full build's cache with room to grow.
      - name: Build for testing
        shell: bash
        run: xcodebuild build-for-testing -project Remux.xcodeproj -scheme Remux -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages" COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_LIMIT_SIZE=2G

      - name: Save compilation cache
        if: github.event_name != 'pull_request' && steps.compilation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
          key: ${{ steps.compilation-cache.outputs.cache-primary-key }}

      - name: Wait for simulator
        shell: bash
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      # A test that fails runs once more, and the job passes if it passes then.
      # The next step names every such test, so it can still be looked into.
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/RemuxUnitTests.xcresult"
          xcodebuild test-without-building -project Remux.xcodeproj -scheme Remux -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" -only-testing:RemuxTests -retry-tests-on-failure -test-iterations 2 -resultBundlePath "${RUNNER_TEMP}/RemuxUnitTests.xcresult" -clonedSourcePackagesDirPath "${RUNNER_TEMP}/SourcePackages"

      - name: Report retried tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/RemuxUnitTests.xcresult"
          if [[ ! -d "${bundle}" ]]; then
            exit 0
          fi

          retried="$(xcrun xcresulttool get test-results tests --path "${bundle}" | jq -r '
            .. | objects
            | select(.nodeType? == "Test Case" and .result? == "Passed")
            | select(any(.children[]?; .nodeType == "Repetition" and .result == "Failed"))
            | "\(.nodeIdentifier): \([.children[]? | select(.nodeType == "Repetition") | .children[]? | select(.nodeType == "Failure Message") | .name] | join("; "))"
            | gsub("\n"; " ")
          ')"
          if [[ -z "${retried}" ]]; then
            exit 0
          fi

          {
            printf '### Tests that passed only on a retry\n\n'
            while IFS= read -r line; do
              printf -- '- %s\n' "${line}"
            done <<< "${retried}"
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r line; do
            printf '::warning title=Passed only on a retry::%s\n' "${line//%/%25}"
          done <<< "${retried}"

      - name: Delete simulator
        if: always() && steps.simulator.outputs.udid != ''
        shell: bash
        run: xcrun simctl delete "${{ steps.simulator.outputs.udid }}"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: remux-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
