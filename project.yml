name: Remux
options:
  bundleIdPrefix: dev.remux
  deploymentTarget:
    iOS: "18.0"
  postGenCommand: |
    /usr/bin/perl -0pi -e 's/lastKnownFileType = wrapper\.icon;/lastKnownFileType = folder.iconcomposer.icon;/g' Remux.xcodeproj/project.pbxproj
    /usr/bin/perl -0pi -e 's/Embed Foundation Extensions/Embed App Extensions/g' Remux.xcodeproj/project.pbxproj
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.remux.app
    PRODUCT_NAME: Remux
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    OTHER_LDFLAGS:
      - -lc++
packages:
  Citadel:
    url: https://github.com/h3nock/Citadel.git
    revision: 1d0eadd81d0a521b00ede6663c8b3301f5fc252e
targets:
  Remux:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RemuxApp/Sources
      - path: RemuxApp/Assets.xcassets
      - path: RemuxApp/Remux.icon
      - path: RemuxApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Remux
        CODE_SIGN_ENTITLEMENTS: RemuxApp/Remux.entitlements
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1"
    preBuildScripts:
      - name: Verify GhosttyKit release mode
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/verify_ghosttykit_release_mode.sh"
    dependencies:
      - framework: ../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        embed: false
      - package: Citadel
      - sdk: FileProvider.framework
      - target: RemuxFileProvider
        embed: true
    info:
      path: RemuxApp/Info.plist
      properties:
        CFBundleDisplayName: Remux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        RemuxApplicationKeychainAccessGroup: $(AppIdentifierPrefix)dev.remux.app
        RemuxSharedKeychainAccessGroup: $(AppIdentifierPrefix)dev.remux.shared
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  RemuxFileProvider:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RemuxFileProvider/Sources
      - path: RemuxApp/Sources/Domain/TmuxConnectionTarget.swift
      - path: RemuxApp/Sources/Domain/SSHPrivateKeyInspector.swift
      - path: RemuxApp/Sources/Domain/TerminalSettings.swift
      - path: RemuxApp/Sources/Persistence/ApplicationStorage.swift
      - path: RemuxApp/Sources/Persistence/ConnectionProfileRepository.swift
      - path: RemuxApp/Sources/Persistence/JSONFileStore.swift
      - path: RemuxApp/Sources/Persistence/SSHCredentialStore.swift
      - path: RemuxApp/Sources/Persistence/TrustedHostStore.swift
      - path: RemuxApp/Sources/App/SSHAuthResolver.swift
      - path: RemuxApp/Sources/SSH/RemuxSFTPClient.swift
      - path: RemuxApp/Sources/SSH/RemuxCitadelSFTPClient.swift
      - path: RemuxApp/Sources/SSH/RemuxSSHRootService.swift
      - path: RemuxApp/Sources/SSH/RemuxSSHAuthenticationMethodFactory.swift
      - path: RemuxApp/Sources/SSH/RemuxTransportStartupTrace.swift
      - path: RemuxApp/Sources/FileProvider
    dependencies:
      - package: Citadel
      - sdk: FileProvider.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remux.app.file-provider
        PRODUCT_NAME: RemuxFileProvider
        PRODUCT_MODULE_NAME: RemuxFileProvider
        CODE_SIGN_ENTITLEMENTS: RemuxFileProvider/RemuxFileProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) REMUX_FILE_PROVIDER_EXTENSION
    info:
      path: RemuxFileProvider/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RemuxSharedKeychainAccessGroup: $(AppIdentifierPrefix)dev.remux.shared
        NSExtension:
          NSExtensionFileProviderDocumentGroup: group.dev.remux
          NSExtensionFileProviderDownloadPipelineDepth: 1
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).RemuxFileProviderExtension
  RemuxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RemuxAppTests
    dependencies:
      - target: Remux
      - framework: ../ghostty-remux-upstream-rebuild/macos/GhosttyKit.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remux.appTests
        PRODUCT_NAME: RemuxTests
        PRODUCT_MODULE_NAME: RemuxTests
        GENERATE_INFOPLIST_FILE: YES
  RemuxUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: RemuxAppUITests
    dependencies:
      - target: Remux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remux.appUITests
        PRODUCT_NAME: RemuxUITests
        PRODUCT_MODULE_NAME: RemuxUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RemuxUIOnly:
    build:
      targets:
        Remux: all
        RemuxUITests: [test]
    test:
      targets:
        - RemuxUITests
  Remux:
    build:
      targets:
        Remux: all
        RemuxFileProvider: all
        RemuxTests: [test]
    test:
      targets:
        - RemuxTests
