<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remux: page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/remux-app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <!-- Served for any address the site doesn't have, so its styles are inline rather than a path that could miss. -->
  <style>
    :root { --bg: #ffffff; --line: #cecfd0; --text: #1f2328; --dim: #57606a; --accent: #367970;
      --fill: #367970; --fill-hover: #296d64; --on-fill: #ffffff; --mark: #b08027; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --line: #3d4147; --text: #e6edf3; --dim: #a5abb1; --accent: #8fd3c8;
        --fill: #367970; --fill-hover: #296d64; --on-fill: #ffffff; --mark: #e2b257; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      -webkit-font-smoothing: antialiased; font-variant-ligatures: none; }
    .wrap { max-width: 118ch; margin: 0 auto; padding: 0 3ch; }
    .top { display: flex; align-items: center; height: 4.2em; border-bottom: 1px solid var(--line); }
    .name { font-weight: 700; letter-spacing: -0.02em; color: inherit; text-decoration: none; display: inline-flex; align-items: center; }
    .name::after { content: ""; display: inline-block; width: .6em; height: 1.1em; margin-left: .15em; background: var(--mark); }
    .pane { margin-top: 3.4em; border: 1px solid var(--line); padding: 3.2em 3ch 2.6em; }
    h1 { margin: 0; font-size: 27px; line-height: 1.3; font-weight: 700; }
    p { margin: 1em 0 0; color: var(--dim); }
    .btn { display: inline-flex; align-items: center; min-height: 44px; margin-top: 2em; padding: 0 2ch; font-weight: 500;
      text-decoration: none; background: var(--fill); color: var(--on-fill); }
    .btn:hover { background: var(--fill-hover); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 520px) { body { font-size: 14px; } .wrap { padding: 0 2ch; } .pane { padding: 3em 2ch 2.2em; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top"><a class="name" href="/" aria-label="Remux">remux</a></header>
    <main class="pane">
      <h1>There's no page at this address.</h1>
      <p>It may have moved, or the link has a typo.</p>
      <a class="btn" href="/">Go to the Remux homepage</a>
    </main>
  </div>
</body>
</html>
